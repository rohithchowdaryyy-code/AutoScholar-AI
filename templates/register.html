<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AutoScholar AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/forms.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">AutoScholar <span>AI</span></div>

            <h1>Create Your Account</h1>

            <p class="subtitle">
                Start discovering scholarships that match your profile.
            </p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">

                <label>Full Name</label>
                <input type="text" name="name"
                       placeholder="Enter your full name" required>

                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Create a password" required>

                <button type="submit">Create Account</button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="{{ url_for('auth.login') }}">Login</a>
            </p>

            <a class="back-link" href="{{ url_for('home') }}">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
