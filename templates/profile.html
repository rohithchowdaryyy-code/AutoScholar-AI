
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile | AutoScholar AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fc;
            color: #1e293b;
            padding: 35px 15px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px #0000000d;
        }

        .logo {
            color: #173b78;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .logo span {
            color: #2563eb;
        }

        h1 {
            color: #173b78;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #2563eb;
        }

        input:disabled {
            background: #f1f5f9;
            color: #64748b;
        }

        .message {
            background: #dcfce7;
            color: #166534;
            padding: 13px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 28px;
            background: #173b78;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2563eb;
        }

        .back {
            display: inline-block;
            margin-top: 22px;
            color: #173b78;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media(max-width: 600px) {
            .container {
                padding: 23px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">AutoScholar <span>AI</span></div>

    <h1>Student Profile</h1>

    <p class="subtitle">
        Complete your academic details to discover scholarships
        that match your eligibility.
    </p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Full Name</label>
        <input type="text" value="{{ student.name }}" disabled>

        <label>Email Address</label>
        <input type="email" value="{{ student.email }}" disabled>

        <label>Education</label>
        <select name="education" required>
            <option value="">Select Education</option>
            <option value="BTech" {% if student.education == "BTech" %}selected{% endif %}>BTech</option>
            <option value="BSc" {% if student.education == "BSc" %}selected{% endif %}>BSc</option>
            <option value="BCom" {% if student.education == "BCom" %}selected{% endif %}>BCom</option>
            <option value="BA" {% if student.education == "BA" %}selected{% endif %}>BA</option>
            <option value="MTech" {% if student.education == "MTech" %}selected{% endif %}>MTech</option>
            <option value="MSc" {% if student.education == "MSc" %}selected{% endif %}>MSc</option>
            <option value="Other" {% if student.education == "Other" %}selected{% endif %}>Other</option>
        </select>

        <label>Course / Branch</label>
        <input
            type="text"
            name="course"
            placeholder="Example: BTech AIML"
            value="{{ student.course or '' }}"
            required
        >

        <label>Academic Percentage (%)</label>
        <input
            type="number"
            name="percentage"
            min="0"
            max="100"
            step="0.01"
            placeholder="Example: 85.5"
            value="{{ student.percentage if student.percentage is not none else '' }}"
        >

        <label>State</label>
        <input
            type="text"
            name="state"
            placeholder="Example: Andhra Pradesh"
            value="{{ student.state or '' }}"
        >

        <label>Gender</label>
        <select name="gender">
            <option value="">Select Gender</option>
            <option value="Male" {% if student.gender == "Male" %}selected{% endif %}>Male</option>
            <option value="Female" {% if student.gender == "Female" %}selected{% endif %}>Female</option>
            <option value="Other" {% if student.gender == "Other" %}selected{% endif %}>Other</option>
        </select>

        <label>Annual Family Income (₹)</label>
        <input
            type="number"
            name="annual_income"
            min="0"
            step="0.01"
            placeholder="Example: 150000"
            value="{{ student.annual_income if student.annual_income is not none else '' }}"
            required
        >

        <label>Category</label>
        <select name="category" required>
            <option value="">Select Category</option>
            <option value="General" {% if student.category == "General" %}selected{% endif %}>General</option>
            <option value="OBC" {% if student.category == "OBC" %}selected{% endif %}>OBC</option>
            <option value="SC" {% if student.category == "SC" %}selected{% endif %}>SC</option>
            <option value="ST" {% if student.category == "ST" %}selected{% endif %}>ST</option>
            <option value="SC/ST" {% if student.category == "SC/ST" %}selected{% endif %}>SC/ST</option>
            <option value="EWS" {% if student.category == "EWS" %}selected{% endif %}>EWS</option>
        </select>

        <button type="submit">Save My Profile</button>

    </form>

    <a class="back" href="{{ url_for('student.dashboard') }}">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
