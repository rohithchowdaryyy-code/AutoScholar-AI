
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | AutoScholar AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 380px;
            max-width: 100%;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #00000015;
        }

        h1 {
            color: #173b78;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #173b78;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2455a0;
        }

        .back-home {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #e2e8f0;
            color: #173b78;
            text-align: center;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-home:hover {
            background: #cbd5e1;
        }

        .flash {
            color: #dc2626;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>AutoScholar AI</h1>
        <p>Administrator Login</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Email Address</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Login as Admin</button>

        </form>

        <a href="{{ url_for('home') }}" class="back-home">
            ← Back to Home
        </a>

    </div>

</body>
</html>
