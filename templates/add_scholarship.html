```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Scholarship | AutoScholar AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            width: 100%;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .back-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .back-btn {
            background: #e2e8f0;
            color: #1e293b;
        }

        .flash {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
        }

        @media(max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Add New Scholarship</h1>

        <p class="subtitle">
            Enter scholarship information and eligibility requirements.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Scholarship Title *</label>
                    <input type="text" name="title" required>
                </div>

                <div class="form-group">
                    <label>Provider Name *</label>
                    <input type="text" name="provider" required>
                </div>

                <div class="form-group full">
                    <label>Description</label>
                    <textarea name="description"></textarea>
                </div>

                <div class="form-group">
                    <label>Scholarship Amount (₹)</label>
                    <input type="number" name="amount" min="0" step="0.01">
                </div>

                <div class="form-group">
                    <label>Application Deadline</label>
                    <input type="date" name="deadline">
                </div>

                <div class="form-group">
                    <label>Education</label>
                    <input type="text" name="education" placeholder="Example: BTech">
                </div>

                <div class="form-group">
                    <label>Course</label>
                    <input type="text" name="course" placeholder="Example: AIML">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select name="category">
                        <option value="">Any Category</option>
                        <option value="General">General</option>
                        <option value="OBC">OBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                        <option value="EWS">EWS</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Maximum Annual Family Income (₹)</label>
                    <input type="number" name="max_income" min="0" step="0.01">
                </div>

                <div class="form-group">
                    <label>Minimum Percentage</label>
                    <input type="number" name="min_percentage" min="0" max="100" step="0.01">
                </div>

                <div class="form-group">
                    <label>State</label>
                    <input type="text" name="state" placeholder="Example: Andhra Pradesh">
                </div>

                <div class="form-group">
                    <label>Gender Eligibility</label>
                    <select name="gender">
                        <option value="">Any Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Official Application URL</label>
                    <input type="url" name="application_url" placeholder="https://example.com">
                </div>

            </div>

            <div class="buttons">

                <button type="submit">Add Scholarship</button>

                <a href="{{ url_for('admin.dashboard') }}" class="back-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
```
